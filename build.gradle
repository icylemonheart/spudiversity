plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

// NeoForge 1.21.1 自带 Java 21 运行时
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir('src/main/templates')
    exclude("**/.cache")
}

// 展开 neoforge.mods.toml 中的 ${...} 占位符
def replaceProperties = [
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_version            : mod_version,
        mod_group_id           : mod_group_id,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        mod_license            : mod_license,
        loader_version_range   : loader_version_range,
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
]

tasks.processResources {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

def localM2 = file('local-m2')
if (localM2.exists()) {
    repositories.all { repo ->
        if (repo.name ==~ /(?i).*neoforg.*/) {
            repo.setUrl(file('nonexistent-empty'))
        }
    }
}

repositories {
    if (localM2.exists()) {
        maven {
            url = localM2
            metadataSources {
                gradleMetadata()
                mavenPom()
                artifact()
            }
        }
    }
    maven {
        url "https://maven.aliyun.com/repository/public"
    }
    mavenCentral()
    maven {
        url "https://libraries.minecraft.net"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    }
    flatDir {
        dir 'libs'
    }
}

// 为 local-m2 的 stub pom 补充 ModDevGradle 所需的 capability variants
//（maven.neoforged.net 被阻断时的离线镜像；网络恢复后删除 local-m2 目录即可自动失效）
if (localM2.exists()) {
    dependencies {
        components {
        withModule('net.neoforged:neoforge') {
            addVariant('moddevConfig') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-moddev-config', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-moddev-config.json')
                }
            }
            addVariant('moddevBundle') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-moddev-bundle', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-universal.jar')
                }
            }
            addVariant('neoforgeDependencies') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-dependencies', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-userdev.jar')
                    addFile('neoforge-21.1.235-universal.jar')
                }
            }
        }
        withModule('net.neoforged:neoform') {
            addVariant('neoformDependencies', 'runtimeElements') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoform')
                    addCapability('net.neoforged', 'neoform-dependencies', '1.21.1-20240808.144430')
                }
                withFiles {
                    addFile('neoform-1.21.1-20240808.144430.zip')
                }
            }
        }
        }
    }
}

